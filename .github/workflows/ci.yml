name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: listener/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
        working-directory: agent
      - run: make install
      - run: make check
