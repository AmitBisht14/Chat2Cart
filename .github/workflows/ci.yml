name: CI

on:
  pull_request:
    # labeled/unlabeled re-run allowlist-review when the owner adds allowlist-approved.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: listener/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
        working-directory: agent
      - run: make install
      - run: make check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --rm check

  allowlist-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the owner's label for allowlist changes
        if: github.event_name == 'pull_request'
        env:
          ALLOWLIST_FILE: agent/src/chat2cart/swiggy/allowlist.py
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'allowlist-approved') }}
        run: |
          if ! git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qxF "$ALLOWLIST_FILE"; then
            echo "The allowlist is unchanged."
            exit 0
          fi
          if [ "$IS_APPROVED" = "true" ]; then
            echo "The allowlist change carries the owner's allowlist-approved label."
            exit 0
          fi
          echo "::error::This pull request changes $ALLOWLIST_FILE. Only the owner adds the label allowlist-approved, after reviewing the change."
          exit 1
