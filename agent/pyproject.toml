[project]
name = "chat2cart"
version = "0.1.0"
description = "Turns WhatsApp messages into a ready Swiggy Instamart cart."
requires-python = ">=3.12"
dependencies = [
    "apscheduler==3.11.3",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "langchain==1.4.9",
    "langchain-anthropic==1.7.10",
    "langchain-openai>=1.7.4",
    "langgraph==1.2.20",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer",
]

[project.scripts]
chat2cart = "chat2cart.cli:app"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat2cart"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# APScheduler 3.x ships no type information.
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
